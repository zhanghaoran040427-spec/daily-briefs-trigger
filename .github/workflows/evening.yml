name: Dispatch Evening Report

# 这个公开仓库只负责每天定时“敲一下”私有仓库 daily-briefs 的持仓报告工作流。
# 里面没有任何个人数据；token 放在本仓库的 Actions secret DISPATCH_TOKEN 里。

on:
  # UTC：13:35 UTC = 北京时间 21:35
  # 备用：14:05 UTC = 北京 22:05，准点那次哑了就由它兜底；
  # 私有仓库里会查 state/sent.json，今天已经发过就直接跳过，不会重复发。
  schedule:
    - cron: "35 13 * * *"
    - cron: "5 14 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "已忽略：想试运行请到私有仓库手动 Run workflow（勾 dry_run）"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dispatch-evening
      cancel-in-progress: false
    steps:
      - name: Trigger evening report
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          # 固定发"真发送"的请求：cron-job.org 的 body 里即使还留着 dry_run 也不影响。
          body='{"ref":"main"}'
          curl -sS --fail --retry 3 --retry-all-errors -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/zhanghaoran040427-spec/daily-briefs/actions/workflows/daily-brief.yml/dispatches" \
            -d "${body}"
          echo "evening report dispatched"

