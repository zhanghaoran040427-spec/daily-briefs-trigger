name: Dispatch Morning Briefs

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "已忽略：想试运行请到私有仓库手动 Run workflow（勾 dry_run）"
        required: false
        default: false
        type: boolean

permissions: {}

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dispatch-morning
      cancel-in-progress: false
    steps:
      - name: Trigger morning briefs
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
        run: |
          set -euo pipefail
          body='{"ref":"main"}'
          curl -sS --fail --retry 3 --retry-all-errors -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/zhanghaoran040427-spec/daily-briefs/actions/workflows/morning-briefs.yml/dispatches" \
            -d "${body}"
          echo "morning briefs dispatched"
