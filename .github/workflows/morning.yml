name: Dispatch Morning Briefs

# 这个公开仓库只负责每天定时“敲一下”私有仓库 daily-briefs 的晨报工作流。
# 里面没有任何个人数据；token 放在本仓库的 Actions secret DISPATCH_TOKEN 里。

on:
  # UTC：23:30 UTC = 北京时间次日 07:30
  # 备用：00:00 UTC = 北京 08:00，准点那次哑了就由它兜底；
  # 私有仓库里会查 state/sent.json，今天已经发过就直接跳过，不会重复发。
  schedule:
    - cron: "30 23 * * *"
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "只生成 HTML，不发邮件（测试用）"
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: dispatch-morning
      cancel-in-progress: false
    steps:
      - name: Trigger morning briefs
        env:
          DISPATCH_TOKEN: ${{ secrets.DISPATCH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          body='{"ref":"main"}'
          if [ "${DRY_RUN}" = "true" ]; then
            body='{"ref":"main","inputs":{"dry_run":"true"}}'
          fi
          curl -sS --fail --retry 3 --retry-all-errors -X POST \
            -H "Authorization: Bearer ${DISPATCH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/json" \
            "https://api.github.com/repos/zhanghaoran040427-spec/daily-briefs/actions/workflows/morning-briefs.yml/dispatches" \
            -d "${body}"
          echo "morning briefs dispatched"

      # 公开仓库 60 天没有提交时 GitHub 会自动停掉定时任务；每天提交一个小文件保持活跃
      - name: Keep repository active
        if: always() && github.event_name == 'schedule'
        continue-on-error: true
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .last-run
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .last-run
          git commit -m "keepalive $(date -u +%F)" || exit 0
          git push
